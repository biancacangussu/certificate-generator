<div class="card p-3 custom-card">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <div class="fw-bold student-name">
        {{ name }}
      </div>
      <small class="small-date">
        Generated on {{ issuedDate | date: 'mediumDate' }}
      </small>
    </div>
    <div class="d-flex align-items-center gap-2">
      <app-secondary-button textButton="View" phClass="ph ph-eye" (click)="redirectToCertificate()"></app-secondary-button>
      <button type="button" class="remove-button" aria-label="Remove certificate" (click)="removeCertificate()">
        <i class="ph ph-x"></i>
      </button>
    </div>
  </div>
</div>
