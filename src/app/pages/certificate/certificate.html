<div class="d-flex flex-column align-items-center">
  <div class="d-flex justify-content-between align-items-center certificate-menu w-100">
    <div routerLink="/" class="d-flex align-items-center back-button">
      <i class="ph ph-arrow-left"></i>
      <p class="mb-0">Back</p>
    </div>
    <app-secondary-button (click)="downloadCertificate()" phClass="ph ph-download-simple" textButton="Download"></app-secondary-button>
  </div>

  @if (certificate) {
    <div #certificateContainer class="certificate d-flex justify-content-center align-items-center">
    <img class="medal-icon" src="certificate/certificate_ribbon.png" alt="" />
    <div class="certificate-content">
      <img class="certificate-signature" src="certificate/certificate_signature.svg" alt="" />
      <div class="certificate-info d-flex flex-column align-items-center">
        <div class="certificate-title-subtitle">
          <h1>CERTIFICATE OF COMPLETION</h1>
          <p>This certifies that</p>
        </div>
        <p class="student-name">{{ certificate?.name }}</p>
        <div class="activities-list-group">
          <p class="activities-list-title">has successfully completed the following activities:</p>
          <p class="activities-list">{{ certificate?.activities.join(', ') }}</p>
        </div>
      </div>
      <p class="issued-date">Issued on {{ certificate?.issuedDate | date: 'longDate' }}</p>
    </div>
  </div>
  }
</div>
